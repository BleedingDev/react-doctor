name: Proven array membership formatting validation

on:
  push:
    branches: [ci/proven-array-membership-validation]

permissions:
  contents: read

concurrency:
  group: proven-array-membership-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.repository == 'BleedingDev/react-doctor' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.18.0"
          cache: pnpm

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check formatting of changed files
        id: format
        run: |
          pnpm run format:check \
            packages/oxlint-plugin-react-doctor/src/plugin/rules/js-performance/js-set-map-lookups.ts \
            packages/oxlint-plugin-react-doctor/src/plugin/rules/js-performance/js-set-map-lookups.regressions.test.ts \
            packages/oxlint-plugin-react-doctor/src/plugin/rules/js-performance/js-set-map-lookups-reactbench-regressions.test.ts \
            packages/fuzz/corpus/regressions/js-set-map-lookups--inferred-string-membership.ts \
            .changeset/proven-array-membership-lookups.md \
            .github/workflows/proven-array-membership-validation.yml

      - name: Capture native formatter correction on failure
        if: ${{ failure() && steps.format.outcome == 'failure' }}
        run: |
          pnpm run format \
            packages/oxlint-plugin-react-doctor/src/plugin/rules/js-performance/js-set-map-lookups.regressions.test.ts
          git diff --binary > "$RUNNER_TEMP/membership-format.patch"

      - name: Upload native formatter correction
        if: ${{ failure() && steps.format.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: membership-format-${{ github.sha }}
          path: ${{ runner.temp }}/membership-format.patch
          if-no-files-found: error
